# Reicht das X-Forwarded-Proto des vorgeschalteten Reverse Proxys (TLS-Terminierung)
# unveraendert durch. $scheme waere hier IMMER "http", weil die Verbindung von aussen
# an diesen Container immer unverschluesselt ist, egal ob der Browser https spricht.
# Ohne diesen Fallback wuerde https-Zugriff faelschlich als http bei der API ankommen.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    # Host-Routing (Domain) macht bereits der vorgeschaltete Reverse Proxy,
    # dieser Container muss selbst keine Domain kennen
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 12 Bilder x 8 MB Limit pro Bild (siehe server/src/lib/upload.js) in einem Beitrag moeglich
    client_max_body_size 100m;

    # Node/Express API
    # ^~ sorgt dafuer, dass nginx hier stoppt und die Bild-Regex-Location weiter unten
    # fuer /api/-Pfade nicht mehr auswertet
    location ^~ /api/ {
        proxy_pass http://api:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        # Session-Cookie muss durchgereicht werden
        proxy_pass_request_headers on;
    }

    # Hochgeladene Bilder, werden vom API-Container verwaltet
    # ^~ noetig, sonst wuerde die Bild-Regex-Location weiter unten zuerst greifen
    # und die Dateien lokal suchen statt sie an den API-Container weiterzureichen
    location ^~ /uploads/ {
        proxy_pass http://api:3000/uploads/;
        proxy_set_header Host $host;
        expires 7d;
        access_log off;
    }

    # Feste, mitgebaute Assets (Logo, Showreel-Video)
    location ~* \.(jpg|jpeg|png|gif|webp|mp4)$ {
        expires 30d;
        access_log off;
        try_files $uri =404;
    }

    # Angular SPA, alle unbekannten Pfade liefern index.html aus
    location / {
        try_files $uri $uri/ /index.html;
    }
}
